[package]
name = "church-app-foundation"
version = "0.1.0"
description = "Non-production Church App desktop foundation"
authors = ["Church App contributors"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "church_app_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = [] }
hmac = { version = "=0.12.1", default-features = false, features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false, features = [] }
tauri = { version = "=2.11.5", features = [] }
zeroize = { version = "=1.9.0", default-features = false, features = [] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
